<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPZ Leaderboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="root" class="hidden">
    <div class="tablet">
      <!-- Header -->
      <div class="lb-head">
        <div class="lb-brand">
          <div class="lb-title-group">
            <span class="lb-title">LEADERBOARD</span>
            <span class="lb-sub">SPICEZ RACING TELEMETRY</span>
          </div>
        </div>
        <button id="closeBtn" class="lb-close" title="Close (ESC)">
          <span>✕</span>
          <span class="close-hint">ESC</span>
        </button>
      </div>

      <!-- Navigation Bar -->
      <div class="lb-nav">
        <div class="lb-tabs" id="tabs">
          <button class="tab active" data-tab="standings">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>
            <span>Standings</span>
          </button>
          <button class="tab" data-tab="classes">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"></path><circle cx="7" cy="17" r="2"></circle><path d="M9 17h6"></path><circle cx="17" cy="17" r="2"></circle></svg>
            <span>Classes</span>
          </button>
          <button class="tab" data-tab="records">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            <span>Track Records</span>
          </button>
          <button class="tab" data-tab="activity">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
            <span>Activity</span>
          </button>
          <button class="tab" data-tab="me">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>My Stats</span>
          </button>
        </div>

        <!-- Search -->
        <div class="lb-search hidden" id="searchbar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
          <input id="searchInput" type="text" placeholder="Search driver / track…" autocomplete="off" />
          <span id="searchCount" class="search-count"></span>
        </div>

        <!-- Class Filter Bar -->
        <div class="lb-classpick hidden" id="classpick">
          <span class="cls-label">CLASS FILTER:</span>
          <button class="cls-btn active" data-cls="S">CLASS S</button>
          <button class="cls-btn" data-cls="A">CLASS A</button>
          <button class="cls-btn" data-cls="B">CLASS B</button>
          <button class="cls-btn" data-cls="C">CLASS C</button>
          <button class="cls-btn" data-cls="D">CLASS D</button>
        </div>
      </div>

      <!-- Main Content View -->
      <div class="lb-body-wrapper">
        <div class="lb-body" id="body">
          <div class="lb-loading">
            <div class="spinner"></div>
            <span>Fetching Telemetry Data...</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
